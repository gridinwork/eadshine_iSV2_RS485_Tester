<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="793" viewBox="0 0 1120 793"><rect width="1120" height="793" fill="#15171a"/><text x="40" y="80" fill="#ffffff" font-family="Segoe UI,Arial" font-size="30">Leadshine iSV2-RS8075V48G — RS-485 Tester</text><rect x="30" y="120" width="1060" height="105" rx="10" fill="#1b1e22" stroke="#40444a"/><text x="50" y="155" fill="#ffffff" font-family="Segoe UI,Arial" font-size="20">1. Подключение USB → RS-485</text><text x="50" y="195" fill="#d8d8d8" font-family="Segoe UI,Arial" font-size="18">COM7   Baud 9600   Parity N   Stop bits 2   Slave ID 16</text><rect x="30" y="245" width="350" height="330" rx="10" fill="#1b1e22" stroke="#40444a"/><text x="50" y="280" fill="#ffffff" font-family="Segoe UI,Arial" font-size="20">2. Телеметрия</text><text x="50" y="320" fill="#d8d8d8" font-family="Segoe UI,Arial" font-size="17">Servo Ready: —</text><text x="50" y="355" fill="#d8d8d8" font-family="Segoe UI,Arial" font-size="17">RUN: —   ERROR: —</text><text x="50" y="390" fill="#d8d8d8" font-family="Segoe UI,Arial" font-size="17">Скорость: — rpm</text><text x="50" y="425" fill="#d8d8d8" font-family="Segoe UI,Arial" font-size="17">Ток: — A   Момент: — %</text><text x="50" y="460" fill="#d8d8d8" font-family="Segoe UI,Arial" font-size="17">DC bus: — V</text><text x="50" y="495" fill="#d8d8d8" font-family="Segoe UI,Arial" font-size="17">Температура: — °C</text><rect x="400" y="245" width="690" height="330" rx="10" fill="#1b1e22" stroke="#40444a"/><text x="420" y="280" fill="#ffffff" font-family="Segoe UI,Arial" font-size="20">3. Первый тест двигателя — JOG через Modbus</text><rect x="430" y="320" width="180" height="50" rx="6" fill="#2b3038" stroke="#5a6068"/><text x="465" y="352" fill="#ffffff" font-family="Segoe UI,Arial" font-size="17">СТАРТ JOG ←</text><rect x="630" y="320" width="180" height="50" rx="6" fill="#2b3038" stroke="#5a6068"/><text x="670" y="352" fill="#ffffff" font-family="Segoe UI,Arial" font-size="17">СТАРТ JOG →</text><rect x="830" y="320" width="220" height="50" rx="6" fill="#2b3038" stroke="#5a6068"/><text x="860" y="352" fill="#ffffff" font-family="Segoe UI,Arial" font-size="17">EMERGENCY STOP</text><rect x="430" y="395" width="620" height="80" rx="6" fill="#2b2410" stroke="#7a651d"/><text x="450" y="430" fill="#ffd36e" font-family="Segoe UI,Arial" font-size="16">Servo Enable (CN1 DI3 / SRV-ON) проверяется отдельно.</text><rect x="30" y="600" width="1060" height="150" rx="10" fill="#1b1e22" stroke="#40444a"/><text x="50" y="635" fill="#ffffff" font-family="Segoe UI,Arial" font-size="20">4. Modbus журнал</text><rect x="50" y="655" width="1020" height="70" rx="5" fill="#111317" stroke="#383c42"/></svg>